<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tienda | Le Miski</title><meta name="description" content="Elige y personaliza tus postres Le Miski."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600&display=swap" rel="stylesheet"><style>
:root{--navy:#092040;--cream:#fffaf4;--paper:#f7eee2;--gold:#b88a38;--muted:#6d6b70;--line:rgba(9,32,64,.15)}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--navy);font-family:"DM Sans",sans-serif}button,input,textarea{font:inherit}.header{display:flex;justify-content:space-between;align-items:center;padding:1.25rem 6vw;border-bottom:1px solid var(--line);gap:1rem}.brand{font:600 clamp(1.7rem,3vw,2.35rem)/.8 "Playfair Display",serif;text-decoration:none;color:var(--navy);letter-spacing:-.06em}.brand small{display:block;margin-top:.4rem;color:var(--gold);font:700 .53rem/1 "DM Sans",sans-serif;text-transform:uppercase;letter-spacing:.2em}.header nav{display:flex;gap:1.2rem;align-items:center;font-size:.78rem;font-weight:700}.header nav a{text-decoration:none;color:var(--navy)}.cart-link{border:1px solid var(--navy);padding:.65rem .85rem}.shell{max-width:1320px;margin:auto;padding:clamp(2.5rem,6vw,5rem) 6vw 5rem}.eyebrow{display:block;color:var(--gold);font-size:.68rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase}.intro{max-width:720px}.intro h1{font:500 clamp(3rem,6vw,6.2rem)/.92 "Playfair Display",serif;letter-spacing:-.07em;margin:.65rem 0 1rem}.intro p{max-width:570px;color:var(--muted);line-height:1.7;margin:0}.tools{display:flex;justify-content:space-between;gap:1rem;margin:2.6rem 0 1.1rem;align-items:center}.search{border:1px solid var(--line);background:#fff;padding:.8rem 1rem;min-width:min(100%,330px);color:var(--navy)}.chips{display:flex;gap:.6rem;overflow:auto;padding:.3rem 0 1.35rem;scrollbar-width:thin}.chip{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--navy);padding:.7rem .9rem;cursor:pointer;font-size:.76rem;font-weight:700}.chip.active{background:var(--navy);border-color:var(--navy);color:#fff}.catalog{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.4rem}.product{border:1px solid var(--line);background:#fff;display:grid;grid-template-columns:minmax(160px,.85fr) 1fr;min-height:280px}.product img{width:100%;height:100%;object-fit:cover}.product-copy{padding:1.5rem;display:flex;flex-direction:column;align-items:flex-start}.product h2{font:500 clamp(1.7rem,3vw,2.5rem)/.98 "Playfair Display",serif;margin:.35rem 0 .8rem;letter-spacing:-.05em}.product p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.6}.availability{font-size:.67rem;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.14em;margin-top:auto;padding-top:1rem}.choose,.add{border:1px solid var(--navy);background:var(--navy);color:#fff;padding:.85rem 1rem;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;margin-top:.75rem}.empty{padding:2rem;border:1px solid var(--line);background:var(--paper);color:var(--muted)}dialog{width:min(720px,100%);max-height:min(92vh,850px);border:0;padding:0;background:var(--cream);color:var(--navy);box-shadow:0 25px 80px rgba(0,0,0,.3)}dialog::backdrop{background:rgba(4,18,38,.6)}.detail{display:grid;grid-template-columns:.85fr 1fr}.detail img{width:100%;height:100%;min-height:310px;object-fit:cover}.detail-copy{padding:2rem;overflow:auto}.close{float:right;border:0;background:transparent;font-size:1.6rem;cursor:pointer;color:var(--navy)}.detail h2{font:500 2.5rem/.95 "Playfair Display",serif;margin:.5rem 2rem .9rem 0;letter-spacing:-.06em}.meta,.detail p{font-size:.86rem;line-height:1.6;color:var(--muted)}.meta{border-block:1px solid var(--line);padding:.75rem 0;margin:1rem 0}.option{border:0;border-top:1px solid var(--line);padding:1rem 0;margin:0}.option legend{font-weight:700;font-size:.82rem;margin-bottom:.7rem}.choices{display:flex;flex-wrap:wrap;gap:.5rem}.choice{border:1px solid var(--line);padding:.6rem .7rem;font-size:.77rem;cursor:pointer;background:#fff}.choice input{accent-color:var(--navy)}textarea{width:100%;min-height:72px;border:1px solid var(--line);padding:.7rem;resize:vertical}.quantity{display:flex;gap:.65rem;align-items:center}.quantity button{width:2.3rem;height:2.3rem;border:1px solid var(--line);background:#fff;cursor:pointer}.pricebar{position:sticky;bottom:-2rem;background:var(--cream);padding:1rem 0 0;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);gap:.8rem}.pricebar strong{font:500 1.9rem "Playfair Display",serif}.add:disabled{opacity:.45;cursor:not-allowed}@media(max-width:800px){.header nav a:not(.cart-link){display:none}.shell{padding-inline:5vw}.tools{display:block}.search{width:100%;margin-top:1rem}.catalog{grid-template-columns:1fr}.product{grid-template-columns:130px 1fr;min-height:240px}.product-copy{padding:1.15rem}.detail{grid-template-columns:1fr}.detail img{height:220px;min-height:0}.detail-copy{padding:1.4rem;max-height:calc(92vh - 220px)}dialog{width:100%;margin:0;align-self:end;max-height:92vh}.pricebar{bottom:-1.4rem;padding-bottom:1rem}.choose{padding:.75rem}.intro h1{font-size:3.5rem}}
</style></head><body>
<header class="header"><a class="brand" href="/">Le Miski<small>Lima · París</small></a><nav><a href="/">Inicio</a><a href="/quienes-somos">Quiénes somos</a><a href="/carta">Carta</a><a class="cart-link" href="/checkout">Mi carrito <span id="cartCount">0</span></a></nav></header>
<main class="shell"><section class="intro"><span class="eyebrow">Boutique en línea</span><h1>Elige el detalle que hará especial el momento.</h1><p>Una selección creada para descubrir, personalizar y pedir con calma. Esta primera edición activa Tortas; las demás colecciones llegarán muy pronto.</p></section><div class="tools"><span class="eyebrow" id="resultLabel">Colección seleccionada</span><input class="search" id="search" type="search" placeholder="Buscar un postre"></div><div class="chips" id="chips" aria-label="Categorías"></div><section class="catalog" id="catalog" aria-live="polite"></section></main>
<dialog id="productDialog"><div class="detail" id="detail"></div></dialog>
<script>
const money=n=>'S/ '+Number(n||0).toFixed(2),store='lemiski-checkout-cart';let catalog=[],categories=[],selectedCategory='tortas',activeProduct=null,qty=1;const cart=()=>{try{return JSON.parse(localStorage.getItem(store)||'[]')}catch{return[]}};const setCart=items=>{localStorage.setItem(store,JSON.stringify(items));updateCart()};function updateCart(){document.querySelector('#cartCount').textContent=cart().reduce((sum,item)=>sum+Number(item.qty||0),0)}function esc(text){return String(text).replace(/[&<>"]/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[char]))}function render(){const query=document.querySelector('#search').value.trim().toLowerCase(),items=catalog.filter(item=>item.category===selectedCategory&&item.name.toLowerCase().includes(query));document.querySelector('#resultLabel').textContent=categories.find(item=>item.id===selectedCategory)?.label||'Colección';document.querySelector('#catalog').innerHTML=items.length?items.map(item=>'<article class="product"><img src="'+item.images[0]+'" alt="'+esc(item.name)+'"><div class="product-copy"><span class="eyebrow">Desde '+money(item.priceFrom)+'</span><h2>'+esc(item.name)+'</h2><p>'+esc(item.shortDescription)+'</p><span class="availability">Requiere '+item.preparationTimeHours+' horas</span><button class="choose" data-product="'+item.id+'">Elegir opciones</button></div></article>').join(''):'<div class="empty">Esta colección estará disponible muy pronto. Puedes explorar otra categoría o ver nuestra <a href="/carta">carta completa</a>.</div>';document.querySelectorAll('[data-product]').forEach(button=>button.onclick=()=>openProduct(button.dataset.product))}function renderChips(){document.querySelector('#chips').innerHTML=categories.map(category=>'<button class="chip '+(category.id===selectedCategory?'active':'')+'" data-category="'+category.id+'">'+category.label+'</button>').join('');document.querySelectorAll('[data-category]').forEach(button=>button.onclick=()=>{selectedCategory=button.dataset.category;renderChips();render()})}function values(option){return option.values.map(value=>'<label class="choice"><input type="'+(option.type==='multiple'?'checkbox':'radio')+'" name="'+option.id+'" value="'+value.id+'"> '+esc(value.label)+(value.price?' · +'+money(value.price):'')+'</label>').join('')}function openProduct(id){activeProduct=catalog.find(item=>item.id===id);qty=1;const detail=document.querySelector('#detail'),fields=activeProduct.options.map(option=>option.type==='text'?'<fieldset class="option"><legend>'+option.label+(option.required?' *':'')+'</legend><textarea data-text="'+option.id+'" maxlength="'+(option.maxLength||240)+'" placeholder="Opcional"></textarea></fieldset>':'<fieldset class="option"><legend>'+option.label+(option.required?' *':'')+'</legend><div class="choices">'+values(option)+'</div></fieldset>').join('');detail.innerHTML='<img src="'+activeProduct.images[0]+'" alt="'+esc(activeProduct.name)+'"><div class="detail-copy"><button class="close" aria-label="Cerrar">×</button><span class="eyebrow">'+activeProduct.preparationTimeHours+' horas de anticipación</span><h2>'+esc(activeProduct.name)+'</h2><p>'+esc(activeProduct.fullDescription)+'</p><div class="meta"><b>Ingredientes y alérgenos:</b> '+esc(activeProduct.allergens.join(', '))+'.<br><b>Porciones:</b> '+esc(activeProduct.servingInformation)+'.<br><b>Conservación:</b> Refrigerar y retirar 15–20 minutos antes de servir.</div>'+fields+'<fieldset class="option"><legend>Cantidad</legend><div class="quantity"><button type="button" data-qty="-1">−</button><b id="quantity">1</b><button type="button" data-qty="1">+</button></div></fieldset><div class="pricebar"><div><small>Precio del producto</small><strong id="price">'+money(activeProduct.priceFrom)+'</strong></div><button class="add" id="add" disabled>Agregar al carrito</button></div></div>';document.querySelector('.close').onclick=()=>productDialog.close();document.querySelectorAll('[data-qty]').forEach(button=>button.onclick=()=>{qty=Math.max(1,qty+Number(button.dataset.qty));document.querySelector('#quantity').textContent=qty;updateDetail()});detail.querySelectorAll('input,textarea').forEach(input=>input.oninput=updateDetail);updateDetail();productDialog.showModal()}function option(id){return activeProduct.options.find(item=>item.id===id)}function selected(id){const input=document.querySelector('input[name="'+id+'"]:checked');return input?.value||''}function updateDetail(){const size=option('size')?.values.find(value=>value.id===selected('size')),flavor=selected('flavor'),extras=[...document.querySelectorAll('input[name="extras"]:checked')].map(input=>option('extras').values.find(value=>value.id===input.value)).filter(Boolean),ready=!!size&&!!flavor,unit=(size?.price||activeProduct.priceFrom)+extras.reduce((sum,item)=>sum+Number(item.price||0),0);document.querySelector('#price').textContent=money(unit*qty);document.querySelector('#add').disabled=!ready;document.querySelector('#add').onclick=()=>addToCart(size,flavor,extras,unit)}function addToCart(size,flavor,extras,unit){const dedication=document.querySelector('[data-text="dedication"]')?.value.trim()||'',notes=document.querySelector('[data-text="notes"]')?.value.trim()||'',extraIds=extras.map(item=>item.id).sort().join(',')||'sin',id=[activeProduct.id,size.id,flavor,extraIds,dedication.replaceAll('|',' '),notes.replaceAll('|',' ')].join('|'),labels=['Tamaño: '+size.label,option('flavor').label+': '+option('flavor').values.find(value=>value.id===flavor).label,...extras.map(item=>item.label),dedication?'Dedicatoria: '+dedication:''].filter(Boolean),items=cart(),existing=items.find(item=>item.id===id);if(existing)existing.qty+=qty;else items.push({id,name:activeProduct.name+' · '+labels.join(' · '),price:unit,qty,selectedOptions:labels});setCart(items);productDialog.close()}
async function boot(){const response=await fetch('/api/catalog'),data=await response.json();categories=data.categories;catalog=data.products;renderChips();render();updateCart()}document.querySelector('#search').oninput=render;boot().catch(()=>document.querySelector('#catalog').innerHTML='<div class="empty">No pudimos cargar la tienda. Intenta nuevamente en unos minutos.</div>');
</script></body></html>
