<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tienda | Le Miski</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600&display=swap" rel="stylesheet"><link href="/tienda/store-enhancements.css" rel="stylesheet"><script src="/tienda/store-enhancements.js" defer></script><style>
:root{--navy:#092040;--cream:#fffaf4;--paper:#f7eee2;--gold:#b88a38;--muted:#6d6b70;--line:rgba(9,32,64,.15)}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--navy);font-family:"DM Sans",sans-serif}button,input,textarea{font:inherit}.header{display:flex;justify-content:space-between;align-items:center;padding:1.25rem 6vw;border-bottom:1px solid var(--line);gap:1rem}.brand{font:600 clamp(1.7rem,3vw,2.35rem)/.8 "Playfair Display",serif;text-decoration:none;color:var(--navy);letter-spacing:-.06em}.brand small{display:block;margin-top:.4rem;color:var(--gold);font:700 .53rem/1 "DM Sans",sans-serif;text-transform:uppercase;letter-spacing:.2em}.header nav{display:flex;gap:1.15rem;align-items:center;font-size:.78rem;font-weight:700}.header nav a{text-decoration:none;color:var(--navy)}.cart-link{border:1px solid var(--navy);padding:.65rem .85rem}.shell{max-width:1320px;margin:auto;padding:clamp(2.5rem,6vw,5rem) 6vw}.eyebrow{display:block;color:var(--gold);font-size:.68rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase}.intro{max-width:760px}.intro h1{font:500 clamp(3rem,6vw,6.2rem)/.92 "Playfair Display",serif;letter-spacing:-.07em;margin:.65rem 0 1rem}.intro p{max-width:620px;color:var(--muted);line-height:1.7;margin:0}.tools{display:flex;justify-content:space-between;gap:1rem;margin:2.6rem 0 1rem;align-items:center}.search{border:1px solid var(--line);background:#fff;padding:.85rem 1rem;min-width:min(100%,330px);color:var(--navy)}.chips{display:flex;gap:.55rem;overflow-x:auto;padding:.4rem 0 1.35rem;scrollbar-width:thin}.chip{white-space:nowrap;border:1px solid var(--line);background:transparent;color:var(--navy);padding:.72rem .92rem;cursor:pointer;font-size:.8rem;font-weight:700}.chip.active{background:var(--navy);border-color:var(--navy);color:#fff}.chip:disabled{opacity:.5;cursor:not-allowed}.chip em{font-style:normal;color:var(--gold);font-size:.67rem;margin-left:.3rem}.catalog{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.4rem}.product{border:1px solid var(--line);background:#fff;display:grid;grid-template-columns:minmax(160px,.85fr) 1fr;min-height:280px}.product img{width:100%;height:100%;object-fit:cover}.product-copy{padding:1.5rem;display:flex;flex-direction:column;align-items:flex-start}.product h2{font:500 clamp(1.7rem,3vw,2.5rem)/.98 "Playfair Display",serif;margin:.35rem 0 .8rem;letter-spacing:-.05em}.product p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.6}.availability{font-size:.67rem;color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.14em;margin-top:auto;padding-top:1rem}.button,.add{border:1px solid var(--navy);background:var(--navy);color:#fff;padding:.85rem 1rem;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;margin-top:.75rem;text-decoration:none}.empty{padding:clamp(2rem,6vw,4rem);border:1px solid var(--line);background:var(--paper);text-align:center}.empty h2{font:500 2rem "Playfair Display",serif;margin:0 0 .7rem}.empty p{color:var(--muted);margin:0 auto 1.2rem;max-width:440px;line-height:1.6}.empty .button{display:inline-block;margin:.25rem}dialog{width:min(720px,100%);max-height:min(92vh,850px);border:0;padding:0;background:var(--cream);color:var(--navy);box-shadow:0 25px 80px rgba(0,0,0,.3)}dialog::backdrop{background:rgba(4,18,38,.6)}.detail{display:grid;grid-template-columns:.85fr 1fr}.detail img{width:100%;height:100%;min-height:310px;object-fit:cover}.detail-copy{padding:2rem;overflow:auto}.close{float:right;border:0;background:transparent;font-size:1.6rem;cursor:pointer;color:var(--navy)}.detail h2{font:500 2.5rem/.95 "Playfair Display",serif;margin:.5rem 2rem .9rem 0;letter-spacing:-.06em}.meta,.detail p{font-size:.86rem;line-height:1.6;color:var(--muted)}.meta{border-block:1px solid var(--line);padding:.75rem 0;margin:1rem 0}.option{border:0;border-top:1px solid var(--line);padding:1rem 0;margin:0}.option legend{font-weight:700;font-size:.82rem;margin-bottom:.7rem}.choices{display:flex;flex-wrap:wrap;gap:.5rem}.choice{border:1px solid var(--line);padding:.6rem .7rem;font-size:.77rem;cursor:pointer;background:#fff}.choice input{accent-color:var(--navy)}textarea{width:100%;min-height:72px;border:1px solid var(--line);padding:.7rem;resize:vertical}.quantity{display:flex;gap:.65rem;align-items:center}.quantity button{width:2.3rem;height:2.3rem;border:1px solid var(--line);background:#fff;cursor:pointer}.pricebar{position:sticky;bottom:-2rem;background:var(--cream);padding:1rem 0 0;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);gap:.8rem}.pricebar strong{font:500 1.9rem "Playfair Display",serif}.add:disabled{opacity:.45;cursor:not-allowed}.help{display:block;margin:2.2rem auto 0;width:max-content;max-width:100%;color:var(--muted);font-size:.82rem;text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:.2rem}@media(max-width:800px){.header nav a:not(.cart-link){display:none}.shell{padding-inline:5vw}.tools{display:block}.search{width:100%;margin-top:1rem}.catalog{grid-template-columns:1fr}.product{grid-template-columns:130px 1fr;min-height:240px}.product-copy{padding:1.15rem}.detail{grid-template-columns:1fr}.detail img{height:220px;min-height:0}.detail-copy{padding:1.4rem;max-height:calc(92vh - 220px)}dialog{width:100%;margin:0;align-self:end;max-height:92vh}.pricebar{bottom:-1.4rem;padding-bottom:1rem}.intro h1{font-size:3.5rem}}
</style></head><body>
<header class="header"><a class="brand" href="/">Le Miski<small>Lima · París</small></a><nav><a href="/">Inicio</a><a href="/quienes-somos">Quiénes somos</a><a href="/tienda">Tienda</a><a class="cart-link bag-link" href="/checkout" aria-label="Bolsa de compra"><svg class="bag-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 8.5h13l-.8 11h-11.4l-.8-11Z"/><path d="M8.5 9V6.75a3.5 3.5 0 0 1 7 0V9"/></svg><span>Bolsa</span><span id="cartCount" class="bag-count">(0)</span></a></nav></header>
<main class="shell"><section class="intro"><span class="eyebrow">Boutique en línea</span><h1>Elige el detalle que hará especial el momento.</h1><p>Descubre nuestras creaciones, personaliza cada detalle y prepara un pedido pensado especialmente para tu celebración.</p></section><div class="tools"><span class="eyebrow" id="resultLabel">Todos</span><input class="search" id="search" type="search" placeholder="Buscar un postre"></div><div class="chips" id="chips" aria-label="Categorías"></div><section class="catalog" id="catalog" aria-live="polite"></section><a class="help" id="helpLink" href="https://wa.me/?text=Hola%2C%20Le%20Miski.%20Necesito%20ayuda%20para%20realizar%20mi%20pedido%20desde%20la%20tienda%20online." target="_blank" rel="noopener">¿Necesitas ayuda? Escríbenos por WhatsApp</a></main>
<dialog id="productDialog"><div class="detail" id="detail"></div></dialog>
<script>
const money=n=>'S/ '+Number(n||0).toFixed(2),store='lemiski-checkout-cart';let products=[],categories=[],selectedCategory='all',activeProduct=null,qty=1,whatsapp='';const $=s=>document.querySelector(s),cart=()=>{try{return JSON.parse(localStorage.getItem(store)||'[]')}catch{return[]}},setCart=items=>{localStorage.setItem(store,JSON.stringify(items));updateCart()},esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function updateCart(){const total=cart().reduce((sum,item)=>sum+Number(item.qty||0),0);$('#cartCount').textContent='('+total+')'}function activeProducts(){return products.filter(product=>product.active)}function results(){const term=$('#search').value.trim().toLowerCase();return activeProducts().filter(product=>(selectedCategory==='all'||product.category===selectedCategory)&&product.name.toLowerCase().includes(term))}function waLink(text){return 'https://wa.me/'+whatsapp+'?text='+encodeURIComponent(text)}function render(){const list=results(),term=$('#search').value.trim();$('#resultLabel').textContent=selectedCategory==='all'?'Todos':categories.find(c=>c.id===selectedCategory)?.label||'Tienda';$('#catalog').innerHTML=list.length?list.map(product=>'<article class="product"><img src="'+product.images[0]+'" alt="'+esc(product.name)+'"><div class="product-copy"><span class="eyebrow">Desde '+money(product.priceFrom)+'</span><h2>'+esc(product.name)+'</h2><p>'+esc(product.shortDescription)+'</p><span class="availability">Requiere '+product.preparationTimeHours+' horas</span><button class="button" data-product="'+product.id+'">Elegir opciones</button></div></article>').join(''):'<div class="empty"><h2>No encontramos productos con esos criterios.</h2><p>Prueba otra búsqueda o vuelve a todas las creaciones disponibles.</p><button class="button" id="showAll">Ver todos los productos</button><a class="button" style="background:transparent;color:var(--navy)" href="'+waLink('Hola, Le Miski. Necesito ayuda para realizar mi pedido desde la tienda online.')+'" target="_blank" rel="noopener">Consultar por WhatsApp</a></div>';document.querySelectorAll('[data-product]').forEach(button=>button.onclick=()=>openProduct(button.dataset.product));$('#showAll')?.addEventListener('click',()=>{selectedCategory='all';$('#search').value='';renderChips();render()})}function renderChips(){const active=new Set(activeProducts().map(product=>product.category));const all=[{id:'all',label:'Todos'},...categories];$('#chips').innerHTML=all.map(category=>{const enabled=category.id==='all'||active.has(category.id);return '<button class="chip '+(selectedCategory===category.id?'active':'')+'" data-category="'+category.id+'" '+(!enabled?'disabled':'')+'>'+category.label+(!enabled?' <em>Próximamente</em>':'')+'</button>'}).join('');document.querySelectorAll('[data-category]').forEach(button=>button.onclick=()=>{selectedCategory=button.dataset.category;renderChips();render()})}function valueChoices(option){return option.values.map(value=>'<label class="choice"><input type="'+(option.type==='multiple'?'checkbox':'radio')+'" name="'+option.id+'" value="'+value.id+'"> '+esc(value.label)+(value.price?' · +'+money(value.price):'')+'</label>').join('')}function openProduct(id){activeProduct=products.find(product=>product.id===id);qty=1;const fields=activeProduct.options.map(option=>option.type==='text'?'<fieldset class="option"><legend>'+option.label+'</legend><textarea data-text="'+option.id+'" maxlength="'+(option.maxLength||240)+'" placeholder="Opcional"></textarea></fieldset>':'<fieldset class="option"><legend>'+option.label+(option.required?' *':'')+'</legend><div class="choices">'+valueChoices(option)+'</div></fieldset>').join('');$('#detail').innerHTML='<img src="'+activeProduct.images[0]+'" alt="'+esc(activeProduct.name)+'"><div class="detail-copy"><button class="close" aria-label="Cerrar">×</button><span class="eyebrow">'+activeProduct.preparationTimeHours+' horas de anticipación</span><h2>'+esc(activeProduct.name)+'</h2><p>'+esc(activeProduct.fullDescription)+'</p><div class="meta"><b>Ingredientes y alérgenos:</b> '+esc(activeProduct.allergens.join(', '))+'.<br><b>Porciones:</b> '+esc(activeProduct.servingInformation)+'.<br><b>Conservación:</b> Refrigerar y retirar 15–20 minutos antes de servir.</div>'+fields+'<fieldset class="option"><legend>Cantidad</legend><div class="quantity"><button type="button" data-qty="-1">−</button><b id="quantity">1</b><button type="button" data-qty="1">+</button></div></fieldset><div class="pricebar"><div><small>Precio del producto</small><strong id="price">'+money(activeProduct.priceFrom)+'</strong></div><button class="add" id="add" disabled>Agregar al carrito</button></div></div>';$('.close').onclick=()=>productDialog.close();document.querySelectorAll('[data-qty]').forEach(button=>button.onclick=()=>{qty=Math.max(1,qty+Number(button.dataset.qty));$('#quantity').textContent=qty;updateDetail()});$('#detail').querySelectorAll('input,textarea').forEach(input=>input.oninput=updateDetail);updateDetail();productDialog.showModal()}function option(id){return activeProduct.options.find(item=>item.id===id)}function selected(id){return document.querySelector('input[name="'+id+'"]:checked')?.value||''}function updateDetail(){const size=option('size')?.values.find(value=>value.id===selected('size')),flavor=selected('flavor'),extras=[...document.querySelectorAll('input[name="extras"]:checked')].map(input=>option('extras').values.find(value=>value.id===input.value)).filter(Boolean),ready=!!size&&!!flavor,unit=(size?.price||activeProduct.priceFrom)+extras.reduce((sum,item)=>sum+Number(item.price||0),0);$('#price').textContent=money(unit*qty);$('#add').disabled=!ready;$('#add').onclick=()=>addToCart(size,flavor,extras,unit)}function addToCart(size,flavor,extras,unit){const dedication=document.querySelector('[data-text="dedication"]')?.value.trim()||'',notes=document.querySelector('[data-text="notes"]')?.value.trim()||'',extraIds=extras.map(item=>item.id).sort().join(',')||'sin',id=[activeProduct.id,size.id,flavor,extraIds,dedication.replaceAll('|',' '),notes.replaceAll('|',' ')].join('|'),labels=['Tamaño: '+size.label,option('flavor').label+': '+option('flavor').values.find(value=>value.id===flavor).label,...extras.map(item=>item.label),dedication?'Dedicatoria: '+dedication:''].filter(Boolean),items=cart(),existing=items.find(item=>item.id===id);if(existing)existing.qty+=qty;else items.push({id,name:activeProduct.name+' · '+labels.join(' · '),price:unit,qty,selectedOptions:labels});setCart(items);productDialog.close()}async function boot(){const [catalogResponse,configResponse]=await Promise.all([fetch('/api/catalog'),fetch('/api/checkout-config')]);const data=await catalogResponse.json(),config=configResponse.ok?await configResponse.json():{};products=data.products;categories=data.categories;whatsapp=config.whatsapp||'';$('#helpLink').href=waLink('Hola, Le Miski. Necesito ayuda para realizar mi pedido desde la tienda online.');renderChips();render();updateCart()}$('#search').oninput=render;boot().catch(()=>$('#catalog').innerHTML='<div class="empty"><h2>No pudimos cargar la tienda.</h2><p>Intenta nuevamente en unos minutos.</p></div>');
</script></body></html>
