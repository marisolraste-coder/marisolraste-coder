<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Colecciones | Le Miski</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600&display=swap" rel="stylesheet">
  <style>:root{--navy:#092040;--cream:#fffaf4;--gold:#b88a38;--muted:#6d6b70;--line:rgba(9,32,64,.15)}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--navy);font-family:"DM Sans",sans-serif}.header{display:flex;justify-content:space-between;align-items:center;padding:1.25rem 6vw;border-bottom:1px solid var(--line);gap:1rem}.brand{font:600 clamp(1.7rem,3vw,2.35rem)/.8 "Playfair Display",serif;color:var(--navy);text-decoration:none;letter-spacing:-.06em}.brand small{display:block;margin-top:.4rem;color:var(--gold);font:700 .53rem "DM Sans",sans-serif;text-transform:uppercase;letter-spacing:.2em}.header nav{display:flex;gap:1.15rem;align-items:center;font-size:.78rem;font-weight:700}.header nav a{color:var(--navy);text-decoration:none}.nav-button,.button{border:1px solid var(--navy);background:var(--navy);color:#fff!important;padding:.75rem .95rem}.shell{max-width:1280px;margin:auto;padding:clamp(3rem,8vw,7rem) 6vw}.intro{max-width:710px;margin-bottom:clamp(3rem,8vw,7rem)}.eyebrow{color:var(--gold);font-size:.68rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase}.intro h1{font:500 clamp(3.3rem,8vw,7rem)/.9 "Playfair Display",serif;letter-spacing:-.075em;margin:.8rem 0 1rem}.intro p{max-width:560px;color:var(--muted);line-height:1.7}.collection{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,8vw,8rem);align-items:center;padding:clamp(3rem,8vw,7rem) 0;border-top:1px solid var(--line)}.collection:nth-child(odd) .media{order:2}.media img,.media video{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#e9ddcf}.copy h2{font:500 clamp(2.8rem,6vw,5.5rem)/.92 "Playfair Display",serif;letter-spacing:-.07em;margin:.6rem 0 1rem}.copy p{color:var(--muted);line-height:1.75;max-width:450px}.button{display:inline-block;text-decoration:none;margin-top:1.25rem;font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase}.empty{padding:4rem 0;color:var(--muted)}@media(max-width:760px){.header nav a:not(.nav-button){display:none}.collection,.collection:nth-child(odd){grid-template-columns:1fr}.collection:nth-child(odd) .media{order:0}.media img,.media video{aspect-ratio:1/1.08}.intro h1{font-size:3.7rem}}</style>
</head>
<body>
  <header class="header"><a class="brand" href="/">Le Miski<small>Lima · París</small></a><nav><a href="/">Inicio</a><a href="/quienes-somos">Quiénes somos</a><a href="/colecciones">Colecciones</a><a class="nav-button" href="/tienda">Crear mi pedido</a></nav></header>
  <main class="shell"><section class="intro"><span class="eyebrow">El universo Le Miski</span><h1>Colecciones que se cuentan con dulzura.</h1><p>Una mirada editorial a cada creación: técnica, inspiración y detalles hechos para permanecer en la memoria.</p></section><div id="collections" aria-live="polite"></div></main>
  <script>const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/catalog').then(r=>r.json()).then(data=>{const list=data.products.filter(p=>p.active);document.querySelector('#collections').innerHTML=list.length?list.map((p,i)=>'<article class="collection"><div class="media">'+(i===0?'<video autoplay muted loop playsinline preload="metadata"><source src="/assets/hero/lemiski-hero-loop.mp4" type="video/mp4"></video>':'<img src="'+p.images[0]+'" alt="'+esc(p.name)+'">')+'</div><div class="copy"><span class="eyebrow">Colección '+esc(data.categories.find(c=>c.id===p.category)?.label||'Le Miski')+'</span><h2>'+esc(p.name)+'</h2><p>'+esc(p.fullDescription)+'</p><a class="button" href="/tienda?producto='+encodeURIComponent(p.id)+'">Personalizar y pedir</a></div></article>').join(''):'<p class="empty">Pronto descubrirás nuestras colecciones.</p>'}).catch(()=>document.querySelector('#collections').innerHTML='<p class="empty">No pudimos cargar las colecciones.</p>');</script>
</body>
</html>
