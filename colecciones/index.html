  <style>:root{--navy:#092040;--cream:#fffaf4;--paper:#f7eee2;--gold:#b88a38;--muted:#6d6b70;--line:rgba(9,32,64,.15)}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--navy);font-family:"DM Sans",sans-serif}.header{display:flex;justify-content:space-between;align-items:center;padding:1.25rem 6vw;border-bottom:1px solid var(--line);gap:1rem}.brand{font:600 clamp(1.7rem,3vw,2.35rem)/.8 "Playfair Display",serif;color:var(--navy);text-decoration:none;letter-spacing:-.06em}.brand small{display:block;margin-top:.4rem;color:var(--gold);font:700 .53rem "DM Sans",sans-serif;text-transform:uppercase;letter-spacing:.2em}.header nav{display:flex;gap:1.15rem;align-items:center;font-size:.78rem;font-weight:700}.header nav a{color:var(--navy);text-decoration:none}.nav-button,.button{border:1px solid var(--navy);background:var(--navy);color:#fff!important;padding:.75rem .95rem}.shell{max-width:1320px;margin:auto;padding:clamp(3rem,8vw,7rem) 6vw}.intro{max-width:760px;margin-bottom:clamp(3rem,7vw,6rem)}.eyebrow{color:var(--gold);font-size:.68rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase}.intro h1,.page-title{font:500 clamp(3.3rem,8vw,7rem)/.9 "Playfair Display",serif;letter-spacing:-.075em;margin:.8rem 0 1rem}.intro p,.collection-copy p,.product-copy p{max-width:620px;color:var(--muted);line-height:1.7}.collection-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.15rem}.collection-card{position:relative;min-height:430px;display:flex;align-items:end;overflow:hidden;text-decoration:none;color:#fff;background:var(--navy);isolation:isolate}.collection-card img,.chocolate-film--collection{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .7s ease}.collection-card::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(4,18,38,.86));z-index:-1}.collection-card:hover img,.collection-card:hover .chocolate-film--collection{transform:scale(1.04)}.collection-c inter}.choice.chosen{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}.choice input{position:absolute;opacity:0}.choice em{font-style:normal;color:var(--gold);font-size:.75rem}.option textarea{width:100%;min-height:82px;margin-top:.75rem;border:1px solid var(--line);padding:.75rem;background:#fff;color:var(--navy);font:inherit}.quantity{display:inline-flex;align-items:center;border:1px solid var(--line);margin-top:.8rem}.quantity button{width:2.8rem;height:2.8rem;border:0;background:#fff;color:var(--navy);font-size:1.2rem;cursor:pointer}.quantity strong{min-width:2.2rem;text-align:center}.buy-bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;border-top:1px solid var(--line);padding-top:1.3rem;margin-top:1.4rem}.buy-bar small{display:block;color:var(--muted);font-size:.75rem}.buy-bar strong{font:500 2rem "Playfair Display",serif}.buy-bar button{border:1px solid var(--navy);background:var(--navy);color:#fff;padding:.95rem 1rem;font:700 .73rem "DM Sans",sans-serif;letter-spacing:.09em;text-transform:uppercase;cursor:pointer}.buy-bar button:disabled{opacity:.4;cursor:not-allowed}.empty{padding:4rem 0;color:var(--muted)}.bag-fab{position:fixed;right:1.4rem;bottom:1.4rem;z-index:5;border:1px solid var(--navy);background:var(--navy);color:#fff;box-shadow:0 12px 35px rgba(9,32,64,.2);padding:.85rem 1rem;display:flex;align-items:center;gap:.5rem;font:700 .76rem "DM Sans",sans-serif;letter-spacing:.06em;cursor:pointer}.bag-icon{width:1rem;height:1rem;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}.drawer{position:fixed;z-index:8;right:0;top:0;width:min(440px,100%);height:100dvh;background:var(--cream);padding:1.5rem;box-shadow:-12px 0 40px rgba(9,32,64,.18);transform:translateX(105%);transition:transform .3s ease;overflow:auto}.drawer.open{transform:translateX(0)}.drawer-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:1rem}.drawer-head h2{font:500 2.2rem "Playfair Display",serif;margin:0}.drawer-close{border:0;background:transparent;font-size:1.5rem;cursor:pointer}.bag-line{display:flex;justify-content:space-between;gap:1rem;border-bottom:1px solid var(--line);padding:1rem 0;font-size:.84rem}.bag-line b,.bag-line small{display:block}.bag-line small{color:var(--muted);margin-top:.25rem;line-height:1.35}.bag-actions{display:flex;gap:.4rem;margin-top:.6rem}.bag-actions button{border:0;background:transparent;color:var(--navy);padding:0;text-decoration:underline;cursor:pointer;font-size:.75rem}.drawer-total{display:flex;justify-content:space-between;padding:1.25rem 0;font:500 1.65rem "Playfair Display",serif}.drawer-checkout{display:block;text-align:center;text-decoration:none;background:var(--navy);color:#fff;padding:.95rem;font-size:.75rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase}.confirmation{position:fixed;z-index:10;left:50%;bottom:2rem;transform:translateX(-50%);width:min(460px,calc(100% - 2rem));background:#fff;border:1px solid var(--line);box-shadow:0 16px 50px rgba(9,32,64,.18);padding:1.2rem}.confirmation p{margin:0 0 .9rem}.confirmation div{display:flex;gap:.7rem}.confirmation button{border:1px solid var(--navy);background:#fff;color:var(--navy);padding:.7rem .8rem;font:700 .72rem "DM Sans",sans-serif;cursor:pointer}.confirmation button:last-child{background:var(--navy);color:#fff}@media(max-width:850px){.header nav a:not(.nav-button){display:none}.collection-grid{grid-template-columns:1fr}.collection-card{min-height:360px}.gallery,.product-layout{grid-template-columns:1fr}.product-copy{position:static}.gallery-head{display:block}.intro h1,.page-title{font-size:3.8rem}.bag-fab{bottom:1rem;right:1rem}.buy-bar{position:sticky;bottom:0;background:var(--cream);padding:1rem 0}}</style>

<body>
  <header class="header"><a class="brand" href="/">Le Miski<small>Lima · París</small></a><nav><a href="/">Inicio</a><a href="/quienes-somos">Nuestra historia</a><a href="/colecciones">Colecciones</a><a class="nav-button" href="/tienda">Crear mi pedido</a></nav></header>
  <main class="shell" id="app" aria-live="polite"></main>
  <button class="bag-fab" id="bagToggle" aria-label="Abrir mi pedido"><svg class="bag-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 8.5h13l-.8 11h-11.4l-.8-11Z"/><path d="M8.5 9V6.75a3.5 3.5 0 0 1 7 0V9"/></svg><span id="bagLabel">Mi pedido (0)</span></button>
  <aside class="drawer" id="drawer" aria-label="Resumen de mi pedido"><div class="drawer-head"><div><span class="eyebrow">Le Miski</span><h2>Mi pedido</h2></div><button class="drawer-close" id="drawerClose" aria-label="Cerrar">×</button></div><div id="drawerItems"></div><div class="drawer-total"><span>Total</span><strong id="drawerTotal">S/ 0.00</strong></div><a class="drawer-checkout" href="/checkout">Continuar pedido</a></aside>
  <div class="confirmation" id="confirmation" hidden><p><b>Se agregó a tu pedido.</b><br><small>Tu creación está guardada en la Bolsa.</small></p><div><button id="continueExplore">Seguir explorando</button><button id="viewBag">Ver mi pedido</button></div></div>
  <script>
  (()=>{const key='lemiski-checkout-cart',app=document.querySelector('#app'),params=()=>new URLSearchParams(location.search),money=n=>'S/ '+Number(n||0).toFixed(2),esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),read=()=>{try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return[]}},write=x=>localStorage.setItem(key,JSON.stringify(x));let data={products:[],categories:[]},qty=1,selected={};const visual={tortas:['Tortas','Creaciones para celebrar con elegancia.','/public/carta/pagina-08.webp'],cuchareables:['Cuchareables','Capas, cremas y recuerdos en cada cucharada.','/public/carta/pagina-06.webp'],helados:['Helados artesanales','Texturas suaves, ingredientes memorables.','amour-pistache.jpeg'],pies:['Pies y tartas','Fruta, merengue y masa hecha con intención.','/public/carta/pagina-04.webp'],cheesecakes:['Cheesecakes','Clásicos refinados para compartir.','/public/carta/pagina-03.webp'],alfajores:['Alfajores','Pequeños clásicos con alma peruana.','/public/carta/pagina-07.webp'],brownies:['Brownies y blondies','Chocolate, mantequilla y el punto justo.','/public/carta/pagina-08.webp'],profiteroles:['Profiteroles','La delicadeza francesa en un pequeño bocado.','profiterol-craquelin.png'],especiales:['Ediciones especiales','Una colección creada para sorprender.','crumble-maiz-morado.png']};const active=()=>data.products.filter(p=>p.active),count=()=>read().reduce((n,i)=>n+Number(i.qty||0),0);function refreshBag(){const items=read(),total=items.reduce((n,i)=>n+Number(i.price)*Number(i.qty),0);document.querySelector('#bagLabel').textContent='Mi pedido ('+count()+')';document.querySelector('#drawerTotal').textContent=money(total);document.querySelector('#drawerItems').innerHTML=items.length?items.map((i,index)=>'<div class="bag-line"><div><b>'+esc(i.name)+'</b><small>'+(i.selectedOptions||[]).map(esc).join(' · ')+'</small><small>'+i.qty+' unidad'+(i.qty===1?'':'es')+'</small><div class="bag-actions"><button data-edit="'+index+'">Editar</button><button data-remove="'+index+'">Eliminar</button></div></div><strong>'+money(i.price*i.qty)+'</strong></div>').join(''):'<p class="empty">Tu pedido todavía está por crear.</p>';document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const items=read();items.splice(Number(b.dataset.remove),1);write(items);refreshBag()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const item=read()[Number(b.dataset.edit)],id=String(item?.id||'').split('|')[0],p=active().find(x=>x.id===id);if(p)location.href='/colecciones?categoria='+encodeURIComponent(p.category)+'&producto='+encodeURIComponent(p.id)});}function showHome(){const enabled=new Set(active().map(p=>p.category));app.innerHTML='<section class="intro"><span class="eyebrow">La carta de Le Miski</span><h1>Explora cada antojo con calma.</h1><p>Una colección para recorrer con los ojos, descubrir con el corazón y hacer parte de tu próxima celebración.</p></section><section class="collection-grid">'+Object.entries(visual).map(([id,[title,copy,image]])=>{const on=enabled.has(id);return on?'<a class="collection-card" href="?categoria='+id+'"><img src="'+image+'" alt="'+esc(title)+'"><div><span class="eyebrow" style="color:#f6d596">Colección</span><h2>'+esc(title)+'</h2><p>'+esc(copy)+'</p></div></a>':'<article class="collection-card disabled"><img src="'+image+'" alt="'+esc(title)+'"><div><span class="soon">Próximamente</span><h2>'+esc(title)+'</h2><p>'+esc(copy)+'</p></div></article>'}).join('')+'</section>'}function showGallery(category){const products=active().filter(p=>p.category===category),label=data.categories.find(c=>c.id===category)?.label||visual[category]?.[0]||'Colección';if(!products.length){showHome();return}app.innerHTML='<a class="back" href="/colecciones">← Todas las colecciones</a><header class="gallery-head"><div><span class="eyebrow">Carta Le Miski</span><h1 class="page-title">'+esc(label)+'</h1></div><p class="collection-copy">Creaciones artesanales pensadas para compartir, celebrar y recordar.</p></header><section class="gallery">'+products.map(p=>'<article class="product-card"><img src="'+p.images[0]+'" alt="'+esc(p.name)+'"><div><span class="eyebrow">Desde '+money(p.priceFrom)+'</span><h2>'+esc(p.name)+'</h2><p>'+esc(p.shortDescription)+'</p><a class="button" href="?categoria='+encodeURIComponent(category)+'&producto='+encodeURIComponent(p.id)+'">Ver detalles</a></div></article>').join('')+'</section>'}function optionMarkup(o){const value=selected[o.id];if(o.type==='text')return '<textarea data-option="'+o.id+'" maxlength="'+(o.maxLength||240)+'" placeholder="Opcional">'+esc(value||'')+'</textarea>';return '<div class="choices">'+o.values.map(v=>{const chosen=o.type==='multiple'?(value||[]).includes(v.id):value===v.id;return '<label class="choice'+(chosen?' chosen':'')+'"><input data-option="'+o.id+'" type="'+(o.type==='multiple'?'checkbox':'radio')+'" value="'+v.id+'" '+(chosen?'checked':'')+'><span>'+esc(v.label)+(v.price?' <em>+'+money(v.price)+'</em>':'')+'</span></label>'}).join('')+'</div>'}function productPrice(p){const size=p.options.find(o=>o.id==='size')?.values.find(v=>v.id===selected.size),extras=p.options.find(o=>o.id==='extras')?.values.filter(v=>(selected.extras||[]).includes(v.id))||[];return(Number(size?.price||p.priceFrom)+extras.reduce((n,x)=>n+Number(x.price||0),0))*qty}function ready(p){return p.options.filter(o=>o.required).every(o=>o.type==='multiple'?(selected[o.id]||[]).length:selected[o.id])}function showProduct(p){app.innerHTML='<a class="back" href="?categoria='+encodeURIComponent(p.category)+'">← Volver a '+esc(data.categories.find(c=>c.id===p.category)?.label||'la colección')+'</a><section class="product-layout"><div class="product-media"><img src="'+p.images[0]+'" alt="'+esc(p.name)+'"></div><div class="product-copy"><span class="eyebrow">'+p.preparationTimeHours+' horas de anticipación</span><h1>'+esc(p.name)+'</h1><p>'+esc(p.fullDescription)+'</p>'+p.options.map(o=>'<fieldset class="option"><legend>'+esc(o.label)+(o.required?' *':'')+'</legend>'+optionMarkup(o)+'</fieldset>').join('')+'<fieldset class="option"><legend>Cantidad</legend><div class="quantity"><button data-qty="-1" aria-label="Reducir cantidad">−</button><strong>'+qty+'</strong><button data-qty="1" aria-label="Aumentar cantidad">+</button></div></fieldset><div class="buy-bar"><div><small>Precio del producto</small><strong>'+money(productPrice(p))+'</strong></div><button id="add" '+(ready(p)?'':'disabled')+'>Agregar al pedido</button></div></div></section>';app.querySelectorAll('[data-option]').forEach(el=>el.oninput=e=>{const o=p.options.find(x=>x.id===e.target.dataset.option);selected[o.id]=o.type==='multiple'?[...app.querySelectorAll('[data-option="'+o.id+'"]:checked')].map(x=>x.value):e.target.value;showProduct(p)});app.querySelectorAll('[data-qty]').forEach(b=>b.onclick=()=>{qty=Math.max(1,qty+Number(b.dataset.qty));showProduct(p)});app.querySelector('#add')?.addEventListener('click',()=>add(p))}function add(p){if(!ready(p))return;const size=selected.size,flavor=selected.flavor,presentation=selected.presentation||'clasica',extras=(selected.extras||[]).slice().sort().join(',')||'sin',dedication=String(selected.dedication||'').replaceAll('|',' '),notes=String(selected.notes||'').replaceAll('|',' '),id=[p.id,size,flavor,presentation,extras,dedication,notes].join('|'),options=p.options.flatMap(o=>{const v=selected[o.id];if(!v||o.type==='text')return v?[o.label+': '+v]:[];return(o.type==='multiple'?v:[v]).map(x=>o.label+': '+o.values.find(k=>k.id===x)?.label).filter(Boolean)}),unit=productPrice(p)/qty,items=read(),old=items.find(x=>x.id===id);if(old)old.qty+=qty;else items.push({id,name:p.name,price:unit,qty,selectedOptions:options});write(items);refreshBag();document.querySelector('#confirmation').hidden=false;qty=1;selected={}}function route(){const q=params(),p=active().find(x=>x.id===q.get('producto'));if(p)showProduct(p);else if(q.get('categoria'))showGallery(q.get('categoria'));else showHome()}fetch('/api/catalog').then(r=>r.json()).then(x=>{data=x;route();refreshBag()}).catch(()=>app.innerHTML='<p class="empty">No pudimos cargar la carta. Intenta nuevamente en unos minutos.</p>');document.querySelector('#bagToggle').onclick=()=>document.querySelector('#drawer').classList.add('open');document.querySelector('#drawerClose').onclick=()=>document.querySelector('#drawer').classList.remove('open');document.querySelector('#continueExplore').onclick=()=>{document.querySelector('#confirmation').hidden=true;location.href='/colecciones'};document.querySelector('#viewBag').onclick=()=>{document.querySelector('#confirmation').hidden=true;document.querySelector('#drawer').classList.add('open')};})();
  </script>
